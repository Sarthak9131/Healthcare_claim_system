name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts evals
      - name: Mypy
        run: mypy src/claims_processing_cx
      - name: Pytest with coverage
        run: pytest tests --cov=claims_processing_cx --cov-report=term-missing

  evaluation:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Regenerate labeled synthetic dataset
        run: python -m evals.generate_dataset
      - name: Run evaluation in mock mode
        run: python -m evals.run_eval
